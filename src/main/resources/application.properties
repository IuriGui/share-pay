spring.application.name=demo

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sharepay}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# o schema é gerenciado pelo Flyway; o Hibernate só valida o mapeamento
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# sem valor padrão de propósito: a aplicação não sobe sem um segredo definido
# gere com: openssl rand -base64 32
security.jwt.secret=${JWT_SECRET:}
security.jwt.expiration=1h

spring.web.error.include-message=never
spring.web.error.include-stacktrace=never

# defina spring.mail.host (e credenciais) para ativar a notificação por email
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=
#spring.mail.password=
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

# Swagger UI em /swagger-ui.html; desligue em produção com SWAGGER_ENABLED=false
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.persist-authorization=false
